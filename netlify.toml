# ═══════════════════════════════════════════════════════════════════════════════
# Netlify Configuration — MJ WebTech Pvt. Ltd.
# Static frontend export with API proxy to Render backend
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  # Build command: Install dependencies and export Flask templates to static HTML
  command = "python -m pip install -r requirements.txt && python scripts/export_static.py"
  # Publish directory: Static HTML files (from dist/)
  publish = "dist"
  # Functions directory for serverless functions (if needed in future)
  functions = "netlify/functions"

[context.production.environment]
  # Ensure Flask runs in production mode during export
  FLASK_ENV = "production"
  # Frontend domain for CORS validation during build
  CORS_ORIGINS = "https://MY_DOMAIN,https://www.MY_DOMAIN"

# ─────────────────────────────────────────────────────────────────────────────
# API Proxy — Route /api calls to Render backend
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/*"
  to = "https://mjwebtech-backend.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {
    X-Forwarded-For = ":ip",
    X-Forwarded-Proto = "https"
  }

# ─────────────────────────────────────────────────────────────────────────────
# Clean URL Redirects
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat"
  status = 200

# Redirect /admin to backend (not available in static export)
[[redirects]]
  from = "/admin"
  to = "https://mjwebtech-backend.onrender.com/admin"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "https://mjwebtech-backend.onrender.com/admin/:splat"
  status = 302

# Redirect auth routes to backend
[[redirects]]
  from = "/login"
  to = "https://mjwebtech-backend.onrender.com/login"
  status = 302

[[redirects]]
  from = "/register"
  to = "https://mjwebtech-backend.onrender.com/register"
  status = 302

[[redirects]]
  from = "/auth/*"
  to = "https://mjwebtech-backend.onrender.com/auth/:splat"
  status = 302

[[redirects]]
  from = "/careers/apply"
  to = "https://mjwebtech-backend.onrender.com/careers/apply"
  status = 302

[[redirects]]
  from = "/dashboard"
  to = "https://mjwebtech-backend.onrender.com/dashboard"
  status = 302

# ─────────────────────────────────────────────────────────────────────────────
# Security Headers — Strict HTTPS, CSP, X-Frame-Options
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Require HTTPS for all requests (1 year preload)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Prevent clickjacking attacks
    X-Frame-Options = "DENY"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Referrer policy
    Referrer-Policy = "no-referrer-when-downgrade"
    
    # Permission policy (disable geolocation, microphone, camera)
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Content Security Policy
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://mjwebtech-backend.onrender.com https://fonts.gstatic.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com"

# ─────────────────────────────────────────────────────────────────────────────
# Cache Control Headers
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
