# Netlify — static frontend for MJ WebTech
# Live API: https://mjwebtech-website.onrender.com
# CORS for the browser origin is set on Render (CORS_ORIGINS), not here.

[build]
  command = "python -m pip install -r requirements.txt && python scripts/export_static.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11.11"
  # Public frontend API origin (not a secret). Used when rendering static HTML.
  API_BASE_URL = "https://mjwebtech-website.onrender.com"

# ── Proxy API calls to Render (covers leftover relative /api/* fetches) ──
[[redirects]]
  from = "/api/*"
  to = "https://mjwebtech-website.onrender.com/api/:splat"
  status = 200
  force = true

# Contact OTP helpers used by the static contact page (non-/api paths)
[[redirects]]
  from = "/contact/send-otp"
  to = "https://mjwebtech-website.onrender.com/contact/send-otp"
  status = 200
  force = true

[[redirects]]
  from = "/contact/verify-otp"
  to = "https://mjwebtech-website.onrender.com/contact/verify-otp"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat"
  status = 200

# Dynamic Flask pages stay on Render
[[redirects]]
  from = "/admin"
  to = "https://mjwebtech-website.onrender.com/admin"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "https://mjwebtech-website.onrender.com/admin/:splat"
  status = 302

[[redirects]]
  from = "/login"
  to = "https://mjwebtech-website.onrender.com/login"
  status = 302

[[redirects]]
  from = "/register"
  to = "https://mjwebtech-website.onrender.com/register"
  status = 302

[[redirects]]
  from = "/auth/*"
  to = "https://mjwebtech-website.onrender.com/auth/:splat"
  status = 302

[[redirects]]
  from = "/careers/apply"
  to = "https://mjwebtech-website.onrender.com/careers/apply"
  status = 302

[[redirects]]
  from = "/dashboard"
  to = "https://mjwebtech-website.onrender.com/dashboard"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self' https://mjwebtech-website.onrender.com https://fonts.gstatic.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com https://www.google.com"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
