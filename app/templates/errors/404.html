{% extends "base.html" %}
{% block title %}404 — Page Not Found | MJ WebTech{% endblock %}
{% block content %}
<section class="error-page">
  <div class="hero-orb hero-orb-1"></div>
  <div class="hero-orb hero-orb-2"></div>
  <div class="container text-center" data-aos="fade-up">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you're looking for doesn't exist or may have moved.</p>
    <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
      <a href="{{ url_for('main.index') }}" class="btn btn-mj-primary btn-lg px-5"><i class="bi bi-house me-2"></i>Go to Home</a>
      <a href="{{ url_for('contact.contact') }}" class="btn btn-mj-outline btn-lg px-5"><i class="bi bi-headset me-2"></i>Contact Support</a>
    </div>
    <div class="error-links mt-4"><p class="text-muted mb-3">You might be looking for:</p><div class="d-flex justify-content-center gap-3 flex-wrap"><a href="{{ url_for('main.services') }}" class="error-link"><i class="bi bi-grid me-1"></i>Services</a><a href="{{ url_for('main.about') }}" class="error-link"><i class="bi bi-building me-1"></i>About Us</a><a href="{{ url_for('blog.blog') }}" class="error-link"><i class="bi bi-newspaper me-1"></i>Blog</a><a href="{{ url_for('careers.careers') }}" class="error-link"><i class="bi bi-briefcase me-1"></i>Careers</a></div></div>
  </div>
</section>
{% endblock %}
