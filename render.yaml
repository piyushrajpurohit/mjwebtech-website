# Render Blueprint — MJ WebTech Flask backend + PostgreSQL
# Repo: https://github.com/piyushrajpurohit/mjwebtech-website
#
# Before first deploy, set these in the Render Dashboard (Blueprint prompts for sync: false):
#   CORS_ORIGINS          real production frontend origin(s), comma-separated
#                         example: https://your-domain.com,https://www.your-domain.com
#                         Do NOT use https://MY_DOMAIN
#   MAIL_USERNAME         Gmail address used for SMTP
#   MAIL_PASSWORD         Gmail App Password (not the account password)
#   TURNSTILE_SITE_KEY    optional Cloudflare Turnstile site key (leave blank to disable)
#   TURNSTILE_SECRET_KEY  optional Cloudflare Turnstile secret (leave blank to disable)
#
# SECRET_KEY is generated by Render. DATABASE_URL is injected from the database.

databases:
  - name: mjwebtech_db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: mjwebtech_db
    user: mjwebtech
    ipAllowList: []

services:
  - type: web
    name: mjwebtech-backend
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/piyushrajpurohit/mjwebtech-website
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_config.py manage:application
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mjwebtech_db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: noreply@mjwebtech.in
      - key: CONTACT_EMAIL
        value: info@mjwebtech.in
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
