# ═══════════════════════════════════════════════════════════════════════════════
# Render Deployment Configuration — MJ WebTech Flask Backend
# This file configures automated deployment on Render.com
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Main Web Service — Flask Backend API
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: mjwebtech-backend
    runtime: python311
    plan: standard
    region: oregon  # Change to your preferred region
    
    # ── Source Control ──
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO  # Update with your GitHub repo
    branch: main
    rootDir: .
    
    # ── Build & Start Commands ──
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      flask db upgrade
    
    startCommand: >
      gunicorn -c gunicorn_config.py manage:application
    
    # ── Environment Variables ──
    # These will be set in Render dashboard — DO NOT hardcode secrets here
    envVars:
      - key: FLASK_ENV
        value: production
      
      - key: SECRET_KEY
        sync: false  # Set in Render dashboard
      
      - key: DATABASE_URL
        fromDatabase:
          name: mjwebtech_db
          property: connectionString
      
      - key: CORS_ORIGINS
        value: https://MY_DOMAIN,https://www.MY_DOMAIN
      
      - key: MAIL_SERVER
        value: smtp.gmail.com
      
      - key: MAIL_PORT
        value: "587"
      
      - key: MAIL_USE_TLS
        value: "true"
      
      - key: MAIL_USERNAME
        sync: false  # Set in Render dashboard
      
      - key: MAIL_PASSWORD
        sync: false  # Set in Render dashboard
      
      - key: MAIL_DEFAULT_SENDER
        value: noreply@mjwebtech.com
      
      - key: CONTACT_EMAIL
        value: info@mjwebtech.com
      
      - key: TURNSTILE_SITE_KEY
        sync: false  # Set in Render dashboard (optional)
      
      - key: TURNSTILE_SECRET_KEY
        sync: false  # Set in Render dashboard (optional)
    
    # ── Health Check ──
    healthCheckPath: /api/health
    healthCheckInterval: 30
    healthCheckTimeout: 5
    maxInstances: 2
    
    # ── Scaling ──
    autoDeploy: true
    disk:
      name: uploads-storage
      mountPath: /app/app/static/uploads
      sizeGB: 5  # Adjust based on expected upload volume
  
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────────────────
  - type: pserv
    name: mjwebtech_db
    plan: standard
    region: oregon  # Match web service region
    ipAllowList: []  # Allow from all (restricting to Render services only)
    postgresMajorVersion: 14
    
    # ── Database Configuration ──
    databaseName: mjwebtech_db
    username: mjwebtech
    # Password is auto-generated by Render
    
    # ── Backup Configuration ──
    enableHighAvailability: false  # Set to true for production HA
